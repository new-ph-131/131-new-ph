name: Build Flutter Web Portal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Production Web App (Custom Web Entry Target, No-Cache Strategy)
        run: flutter build web -t lib/web_live_sync/web_main.dart --release --base-href "/" --pwa-strategy=none

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharoah-web-portal-build
          path: build/web
