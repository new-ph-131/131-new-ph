name: Build Flutter Web Portal and Android APK

on:
  push:
    branches: [ main, master, fix-purchase-sync-identity-outbox-v2 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter regression tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharoah-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Production Web App (Custom Web Entry Target, No-Cache Strategy)
        run: flutter build web -t lib/web_live_sync/web_main.dart --release --base-href "/" --pwa-strategy=none

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharoah-web-portal-build
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Deploy Web to Cloudflare Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment blocked: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx --yes wrangler@3 pages deploy build/web --project-name=pharoah-erp
