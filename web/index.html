<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pharoah ERP Web Workstation</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      try {
        // Blob worker bypasses Safari / WebKit cross-origin worker restriction completely
        const workerBlob = new Blob([
          'importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");'
        ], { type: 'application/javascript' });
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(workerBlob);
      } catch (e) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    }

    window.extractPdfTextFromBytes = async function(rawBytes) {
      try {
        let uint8;
        if (rawBytes instanceof Uint8Array) {
          uint8 = rawBytes;
        } else if (rawBytes && rawBytes.buffer) {
          uint8 = new Uint8Array(rawBytes.buffer, rawBytes.byteOffset || 0, rawBytes.byteLength || rawBytes.length);
        } else {
          uint8 = new Uint8Array(rawBytes);
        }

        const loadingTask = pdfjsLib.getDocument({
          data: uint8,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true,
          standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',
          stopAtErrors: false
        });
        const pdf = await loadingTask.promise;
        let fullLines = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          
          const items = textContent.items.map(it => ({
            str: it.str,
            x: it.transform[4],
            y: it.transform[5]
          }));

          // Group by Y with 8.0px tolerance (matches Marg ERP table rows perfectly)
          const lineGroups = [];
          items.sort((a, b) => b.y - a.y);

          for (const it of items) {
            if (!it.str || it.str.trim().length === 0) continue;
            let matchedGroup = lineGroups.find(g => Math.abs(g.y - it.y) <= 8.0);
            if (!matchedGroup) {
              matchedGroup = { y: it.y, items: [] };
              lineGroups.push(matchedGroup);
            }
            matchedGroup.items.push(it);
          }

          // Sort lines top to bottom
          lineGroups.sort((a, b) => b.y - a.y);

          // Sort items horizontally inside each line
          for (const group of lineGroups) {
            group.items.sort((a, b) => a.x - b.x);
            const lineStr = group.items.map(it => it.str.trim()).filter(s => s.length > 0).join(' ');
            if (lineStr.length > 0) {
              fullLines.push(lineStr);
            }
          }
        }
        return fullLines.join('\n');
      } catch (e) {
        console.error('PDF.js parsing exception:', e);
        return '';
      }
    };
  </script>
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
